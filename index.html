<style>
:root{--bg:#FFF6EC;--card:#fff;--ink:#1E1033;--mute:#6B5A80;--line:#E8DCCB;--accent:#FF5A2C;--accent2:#7B5CFF;--ok:#13a48f;--bad:#d6334a}
@media (prefers-color-scheme:dark){:root{--bg:#1E1033;--card:#2B1A47;--ink:#FFF6EC;--mute:#B9A8D6;--line:#3F2B63;--accent:#FF7A4D;--accent2:#A592FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.05}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.4rem}
.logo span{color:var(--accent)}
main{max-width:1050px;margin:0 auto;padding:20px}
.hero{padding:36px 0 24px}
.hero h1{font-size:clamp(3rem,13vw,7.5rem);font-weight:800;letter-spacing:-.03em}
.hero p{max-width:46ch;color:var(--mute);font-size:1.1rem}
.eq{display:flex;align-items:flex-end;gap:5px;height:90px;margin:24px 0}
.eq i{flex:1;max-width:18px;background:var(--accent);border-radius:4px 4px 0 0;animation:eq 1.1s ease-in-out infinite alternate}
.eq i:nth-child(even){background:var(--accent2)}
@keyframes eq{from{height:12%}to{height:100%}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:55%}}
.btn{background:var(--accent);color:#1E1033;border:0;padding:12px 22px;border-radius:10px;font-weight:700;text-decoration:none;display:inline-block}
.btn.ghost{background:none;border:2px solid var(--ink);color:var(--ink)}
.grid{display:grid;gap:14px}
.three{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:1.15rem;margin-bottom:8px}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:2.2rem}
.stat span{color:var(--mute);font-size:.9rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row small{color:var(--mute);display:block}
.tag{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--ok);color:#fff;white-space:nowrap}
.mini{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);text-decoration:none;font-size:.9rem}
.mini.go{background:var(--ok);color:#fff;border-color:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.8rem;color:var(--mute)}
.chart i{display:block;width:100%;background:var(--accent2);border-radius:6px 6px 0 0;margin-bottom:4px}
form{display:grid;gap:10px;margin-top:10px}
input,select{padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;width:100%}
.msg{margin:8px 0 0;font-weight:500}
.note{background:#fff3cd;color:#5c4400;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:.9rem}
h2{font-size:2rem;margin:6px 0 16px}
[hidden]{display:none!important}
footer{text-align:center;color:var(--mute);padding:30px;font-size:.9rem}
footer a{color:var(--mute)}

html{scroll-behavior:smooth}
body{background:radial-gradient(900px 500px at 85% -5%,rgba(123,92,255,.18),transparent 60%),radial-gradient(700px 500px at -5% 20%,rgba(255,90,44,.16),transparent 60%),var(--bg);background-attachment:fixed}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.hx{display:grid;gap:28px;align-items:center;padding:24px 0 10px}
@media(min-width:820px){.hx{grid-template-columns:1.15fr .85fr;gap:40px}}
.pill{display:inline-block;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
.hx h1{font-size:clamp(3.2rem,14vw,7.5rem);font-weight:800;letter-spacing:-.03em;margin:14px 0 10px;background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hx p{max-width:44ch;color:var(--mute);font-size:1.1rem;margin:0 0 18px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span.hot{background:var(--accent);color:#1E1033;border-color:var(--accent);font-weight:700}
.tags span{border:1.5px solid var(--line);background:var(--card);padding:5px 13px;border-radius:999px;font-size:.88rem;font-weight:500}
.hx-photo{position:relative;max-width:420px;width:100%;margin:0 auto}
.hx-photo .glow{position:absolute;inset:-14px;border-radius:220px 220px 36px 36px;background:linear-gradient(160deg,var(--accent),var(--accent2));filter:blur(22px);opacity:.55}
.hx-photo img{position:relative;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:200px 200px 28px 28px;border:4px solid var(--card)}
.chip{position:absolute;background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:700;font-size:.85rem;box-shadow:0 8px 22px rgba(30,16,51,.25)}
.chip.c1{left:-8px;top:34%}.chip.c2{right:-8px;bottom:24%}
.sec{margin-top:44px}
.sec>h2{font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 6px}
.sec>.sub{color:var(--mute);margin:0 0 18px}
.player{display:grid;gap:14px;background:linear-gradient(135deg,#2B1A47,#1E1033);color:#FFF6EC;border:0;border-radius:22px;padding:22px}
.player .top{display:flex;align-items:center;gap:16px}
.pbtn{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),#ff9a3c);color:#1E1033;font-weight:800;font-size:.95rem}
.player h3{font-size:1.3rem;margin:0}
.player small{color:#B9A8D6}
.player .eq{height:64px;margin:0}
body:not(.playing) .eq i{animation-play-state:paused}
.seek{display:flex;align-items:center;gap:12px;font-size:.85rem;color:#B9A8D6}
.seek input{flex:1;padding:0;accent-color:var(--accent);height:28px;background:none;border:0}
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.gal figure{margin:0;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.gal img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(20,8,40,.85));color:#fff;font-weight:700}
.soc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.soc a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);padding:14px 16px;border-radius:14px;font-weight:700}
.soc a small{display:block;color:var(--mute);font-weight:400}
.soc a:hover{border-color:var(--accent);transform:translateY(-2px)}
.soc a.wa{background:#13a48f;color:#fff;border-color:#13a48f}.soc a.wa small{color:#e6fffa}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#13a48f;color:#fff;text-decoration:none;font-weight:700;padding:14px 20px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.card h3{font-size:1.2rem}
.book-card{border:2px solid var(--accent);border-radius:22px;padding:22px}
.share{margin-top:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:st}
@media(min-width:720px){.steps{grid-template-columns:repeat(4,1fr)}}
.steps li{counter-increment:st;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 16px 64px;position:relative}
.steps li:before{content:counter(st);position:absolute;left:14px;top:14px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;display:grid;place-items:center}
@media(min-width:720px){.steps li{padding:62px 16px 16px}.steps li:before{left:16px;top:16px}}
.steps li b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem;margin-bottom:4px}
.steps li span{color:var(--mute);font-size:.95rem}
.rider-h{font-size:1.5rem;margin:30px 0 4px}
.rider{display:grid;gap:8px}
.rider details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.rider summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.rider summary::-webkit-details-marker{display:none}
.rider summary:after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
.rider details[open] summary:after{content:"\2212"}
.rider p{margin:0 0 14px;color:var(--mute)}
.rn{display:grid;gap:16px;align-items:center;background:linear-gradient(120deg,var(--accent),#ff9a3c 55%,#ffd36b);color:#1E1033;border-radius:22px;padding:24px}
@media(min-width:720px){.rn{grid-template-columns:1fr auto;padding:30px}}
.rn h2{font-size:clamp(2rem,8vw,3rem);margin:10px 0 6px}
.rn p{margin:0;max-width:46ch;font-weight:500}
.rn .btn{background:#1E1033;color:#FFF6EC}
.about{display:grid;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}
@media(min-width:720px){.about{grid-template-columns:.8fr 1.2fr;padding:18px;gap:30px}}
.about img{width:100%;max-width:380px;height:auto;margin:0 auto;display:block;border-radius:18px}
.about h3{font-size:1.8rem;margin-bottom:10px}
.about p{color:var(--mute);margin:0 0 12px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
</style>
